# CIMP-BIIF portal: production stack on one server.
#   cp .env.production.example .env.production   # fill in every value (never commit it)
#   docker compose --env-file .env.production up -d --build
# Services: Caddy (HTTPS, automatic certificates) → app → PostgreSQL. See docs/deployment.md.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: cimp
      POSTGRES_USER: cimp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cimp -d cimp"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Applies committed migrations (prisma migrate deploy), then exits.
  migrate:
    build: { context: ., target: build }
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://cimp:${POSTGRES_PASSWORD}@db:5432/cimp?schema=public
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?set NEXT_PUBLIC_APP_URL in .env.production}
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://cimp:${POSTGRES_PASSWORD}@db:5432/cimp?schema=public
    volumes:
      - uploads:/data/uploads
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    expose: ["3000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
