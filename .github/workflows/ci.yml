name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cimp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cimp_ci?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      COMPANY_EMAIL_DOMAINS: cimp.local
      # production mode requires https; only used in links inside emails
      NEXT_PUBLIC_APP_URL: https://ci.example.invalid
      SCHEDULER_ENABLED: "false"
      CRON_SECRET: ci-only-cron-secret-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
      MAIL_TRANSPORT: log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migrations apply cleanly
        run: npx prisma migrate deploy
      - name: Migrations match the schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url postgresql://postgres:postgres@localhost:5432/postgres --exit-code
      - name: Seed demo data
        run: npm run seed
      - name: Build
        run: npm run build
      - name: API tests against the built server
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health && break; sleep 2; done
          E2E_BASE_URL=http://localhost:3000 npm run test:e2e
        env:
          NODE_ENV: production
      - name: Server log
        if: failure()
        run: cat server.log || true
